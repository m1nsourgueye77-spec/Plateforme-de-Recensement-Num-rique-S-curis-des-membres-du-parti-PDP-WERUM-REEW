</select>

<input type="tel" name="commune" required>

<input type="text" name="bureauVote">

</button>


<button type="button"
onclick="precedent()">

Précédent

</button>

<button type="submit">
Suivant
</button>

</form>

</div>



<script src="js/script.js"></script>
<script src="js/navigation.js"></script>
<script src="js/validation.js"></script>


<script>
const form = document.querySelector("form");

remplirFormulaire();

form.addEventListener("submit", function(e){

    e.preventDefault();

    if(!verifier(form)){
        return;
    }


    sauvegarderFormulaire(form);

    suivant("etape3.html");

});
</script>
