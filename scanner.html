<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Scanner une carte - PDP Wérum Réw</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .scanner-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
        }

        #resultat {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .succes {
            background: #e8f5e9;
            border: 1px solid #4caf50;
        }

        .erreur {
            background: #ffebee;
            border: 1px solid #f44336;
        }

        .info-adherent {
            text-align: left;
            margin-top: 15px;
        }

        .info-adherent p {
            margin: 8px 0;
        }

        .btn {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }




        .import-qr {
    text-align: center;
    margin: 25px auto;
    padding: 20px;
    border: 1px dashed #008C99;
    border-radius: 12px;
    max-width: 500px;
}

.import-qr .btn {
    background: #008C99;
    color: white;
    padding: 13px 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.aide-import {
    font-size: 13px;
    color: #666;
    margin-top: 12px;
}

    </style>

</head>


<body>


<div class="container scanner-container">

    <h1>
        📷 Scanner une carte
    </h1>

    <p>
        Présentez le QR Code de la carte
        de membre devant la caméra.
    </p>


    <!-- =============================== -->
    <!-- LECTEUR QR -->
    <!-- =============================== -->

    <div id="reader"></div>

    <div class="import-qr">
    <p><strong>Ou importer une image QR Code</strong></p>

    <input
        type="file"
        id="qrImageInput"
        accept="image/*"
        hidden
    >

    <button
        type="button"
        class="btn"
        onclick="document.getElementById('qrImageInput').click()"
    >
        🖼️ Importer un QR Code
    </button>

    <p class="aide-import">
        Sélectionnez une image QR Code depuis votre galerie
        ou les fichiers de votre appareil.
    </p>
</div>


    <!-- =============================== -->
    <!-- RESULTAT -->
    <!-- =============================== -->

    <div id="resultat">

    <h2 id="titreResultat"></h2>

    <div
        id="informations"
        class="info-adherent"
    ></div>

    <button
        type="button"
        class="btn"
        onclick="nouveauScan()"
    >
        🔄 Scanner une autre carte
    </button>

</div>


    <button
        type="button"
        class="btn"
        onclick="window.location.href='adhesion.html'"
    >
        🏠 Retour à l'accueil
    </button>


</div>


<!-- ================================= -->
<!-- BIBLIOTHÈQUE QR SCANNER -->
<!-- ================================= -->

<script src="https://unpkg.com/html5-qrcode"></script>


<!-- ================================= -->
<!-- SCRIPT DU SCANNER -->
<!-- ================================= -->

<script src="js/scanner.js"></script>


</body>

</html>
