<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adhésion - PDP Wérum Réw Mbao</title>
<link rel="stylesheet" href="css/style.css">


</head>

<body>

<div class="container">

<h2>Formulaire d'adhésion</h2>

<form id="form1">

<label>Prénom et Nom</label>
<input type="text" name="nom" required>



<label>Date de naissance</label>
<input 
    type="text" 
    name="naissance" 
    placeholder="Ex. 10 Octobre 1980" 
    required
>



<label>Sexe</label>
<select name="sexe" required>
<option value="">Choisir</option>
<option>Homme</option>
<option>Femme</option>
</select>

<label>Téléphone</label>
<input type="tel" name="telephone" required>

<label>Quartier</label>
<input type="text" name="quartier" required>

<label>Profession</label>
<input type="text" name="profession">


<label>Statut électoral</label>
<select name="statut_electoral" id="statut_electoral" required>
    <option value="">Choisir</option>
    <option value="Votant">Votant</option>
    <option value="Non votant">Non votant</option>
</select>

<label>Numéro de CNI</label>
<input
    type="text"
    name="cni"
    id="cni"
    placeholder="Saisir le numéro de CNI"
    required
>

<label>Numéro Carte Électeur (facultatif)</label>
<input
    type="text"
    name="electeur"
    placeholder="Numéro de carte d'électeur (facultatif)"
>




<button type="submit">
Suivant
</button>
</form>

</div>



<script src="js/script.js"></script>
<script src="js/navigation.js"></script>
<script src="js/validation.js"></script>

<script>
const form = document.getElementById("form1");


const statut = document.getElementById("statut_electoral");
const cni = document.getElementById("cni");

statut.addEventListener("change", function () {

    cni.required = true;

    if (this.value === "Votant") {
        cni.placeholder = "CNI obligatoire - Votant";
    } 
    else if (this.value === "Non votant") {
        cni.placeholder = "CNI obligatoire - Non votant";
    }

});

// Remplit les champs si des données existent déjà
remplirFormulaire();

// Restaurer le placeholder selon le statut électoral enregistré
if (statut.value === "Votant") {
    cni.placeholder = "CNI obligatoire - Votant";
} else if (statut.value === "Non votant") {
    cni.placeholder = "CNI obligatoire - Non votant";
}

form.addEventListener("submit", function(e){

    e.preventDefault();

    if(!verifier(form)){
        return;
    }


    sauvegarderFormulaire(form);

    console.log(chargerDonnees());

    suivant("etape2.html");

});
</script>
</body>
</html>
