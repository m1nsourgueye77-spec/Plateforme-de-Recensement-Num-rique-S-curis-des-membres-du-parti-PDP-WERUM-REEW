<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Adhésion enregistrée</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="page-merci">


<div class="card">

    <h1>
        🎉 Félicitations !
    </h1>


    <h2>
        Votre adhésion a été enregistrée
        avec succès.
    </h2>


    <div class="numero">

        Numéro d'adhérent

        <br><br>

        <strong id="numeroAdherent">
            En cours...
        </strong>

    </div>


    <p>
        Votre numéro d'adhérent a été généré
        automatiquement.
    </p>


    <div
        id="qrcode"
        style="margin:20px auto;"
    >
    </div>


    <p>
        Présentez ce QR Code pour retrouver
        votre adhésion.
    </p>


    <button
        type="button"
        onclick="telechargerPDF()"
    >
        📄 Télécharger ma fiche PDF
    </button>


    <button onclick="window.location='carte.html'">
    🪪 Voir ma carte de membre
</button>

<button onclick="window.location='adhesion.html'">
    🏠 Retour à l'accueil
</button>


</div>


<!-- =============================== -->
<!-- JAVASCRIPT -->
<!-- =============================== -->

<script src="js/script.js"></script>


<!-- QR CODE -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="js/qrcode.js"></script>


<!-- PDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const elementNumero = document.getElementById("numeroAdherent");

    // Récupération des données enregistrées
    const adhesion = localStorage.getItem("adhesionPDP");

    if (!adhesion) {
        elementNumero.textContent = "Données introuvables";
        console.error("Aucune donnée adhesionPDP.");
        return;
    }

    let data;

    try {
        data = JSON.parse(adhesion);
    } catch (error) {
        elementNumero.textContent = "Données invalides";
        console.error("Erreur de lecture :", error);
        return;
    }

    // Le numéro doit provenir du serveur
    const numero = data.numeroAdherent;

    if (!numero || !/^PDP-2026-\d{6}$/.test(numero)) {
        elementNumero.textContent = "Numéro officiel indisponible";

        console.error("Numéro officiel absent ou invalide.");

        return;
    }

    // Affichage du numéro officiel
    elementNumero.textContent = numero;

    // Génération du QR Code
    if (typeof genererQRCode === "function") {
        genererQRCode(numero);
    } else {
        console.error("Fonction genererQRCode introuvable.");
    }

    console.log("Adhésion confirmée :", numero);

});

// ==========================================
// TÉLÉCHARGEMENT PDF
// ==========================================

function telechargerPDF() {

    const adhesion =
        localStorage.getItem(
            "adhesionPDP"
        );


    if (!adhesion) {

        alert(
            "Aucune donnée d'adhésion disponible."
        );

        return;
    }


    let data;


    try {

        data =
            JSON.parse(adhesion);

    } catch (error) {

        alert(
            "Impossible de lire les données."
        );

        return;
    }


    if (!window.jspdf) {

        alert(
            "La bibliothèque PDF n'est pas chargée."
        );

        return;
    }


    const { jsPDF } =
        window.jspdf;


    const doc =
        new jsPDF();


    let y = 20;


    // =====================================
    // TITRE
    // =====================================

    doc.setFontSize(18);

    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.text(
        "PDP WÉRUM RÉW",
        105,
        y,
        {
            align: "center"
        }
    );


    y += 10;


    doc.setFontSize(14);

    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.text(
        "FICHE D'ADHÉSION",
        105,
        y,
        {
            align: "center"
        }
    );


    y += 15;


    // =====================================
    // INFORMATIONS
    // =====================================

    const lignes = [

        [
            "Numéro adhérent",
            data.numeroAdherent
        ],

        [
            [
            "Date de validation",
             data.dateValidation || "Non renseignée"
         ],

        [
            "Prénom et Nom",
            data.nom
        ],

        [
            "Date de naissance",
            data.naissance
        ],

        [
            "Sexe",
            data.sexe
        ],

        [
            "Téléphone",
            data.telephone
        ],

        [
            "Adresse / Quartier",
            data.quartier ||
            data.adresse
        ],

        [
            "Profession",
            data.profession
        ],

        [
            "CNI",
            data.cni
        ],

        [
            "Numéro Non Votant",
            data.nonvotant
        ],

        [
            "Carte électeur",
            data.electeur
        ],

        [
            "Région",
            data.region
        ],

        [
            "Département",
            data.departement
        ],

        [
            "Commune",
            data.commune
        ],

        [
            "Centre de vote",
            data.centre
        ],

        [
            "Bureau de vote",
            data.bureau
        ],

        [
            "Cellule",
            data.cellule
        ],

        [
            "Fonction",
            data.fonction
        ],

        [
            "Poste de responsabilité",
            data.poste_responsabilite
        ],

        [
            "Date d'adhésion",
            data.adhesion
        ],

        [
            "Collecteur",
            data.nomcollecteur
        ],

        [
            "Contact collecteur",
            data.contactcollecteur
        ]

    ];


    // =====================================
    // AFFICHAGE
    // =====================================

    doc.setFontSize(10);


    lignes.forEach(
        function ([label, valeur]) {


            if (y > 275) {

                doc.addPage();

                y = 20;

            }


            doc.setFont(
                "helvetica",
                "bold"
            );


            doc.text(
                label + " :",
                20,
                y
            );


            doc.setFont(
                "helvetica",
                "normal"
            );


            doc.text(
                String(
                    valeur ||
                    "Non renseigné"
                ),
                80,
                y
            );


            y += 8;

        }
    );


    // =====================================
    // TÉLÉCHARGEMENT
    // =====================================

    const numero =
        data.numeroAdherent ||
        "PDP";


    doc.save(
        "Adhesion_" +
        numero +
        ".pdf"
    );

}

</script>


</body>

</html>
